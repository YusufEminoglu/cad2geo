[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad2geo"
version = "0.12.2"
authors = [
    { name = "Yusuf Eminoğlu", email = "yusufeminoglu@gmail.com" }
]
description = "Convert Netcad NCZ/NCA and DXF CAD drawings to GeoJSON in pure Python (no GDAL, no QGIS), plus civil-engineering calculators."
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
    "cad",
    "gis",
    "geojson",
    "netcad",
    "ncz",
    "nca",
    "geospatial",
    "converter",
    "dxf",
    "dxf-to-geojson",
    "ncz-to-geojson",
    "cad-to-gis",
    "netcad-converter",
    "civil-engineering",
    "surveying",
    "qgis",
    "turkey",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
cad2geo = "cad2geo.cli:main"

[project.urls]
Homepage = "https://geophilo.com/"
Repository = "https://github.com/YusufEminoglu/cad2geo"
Issues = "https://github.com/YusufEminoglu/cad2geo/issues"
Documentation = "https://geophilo.com/cad2geo/"
Changelog = "https://github.com/YusufEminoglu/cad2geo/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cad2geo = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["cad2geo"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
