<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091717"/>
      <stop offset="100%" stop-color="#112626"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg)" stroke="url(#glow)" stroke-width="6" filter="url(#shadow)"/>

  <!-- Left: CAD Drafting Grid & Crosshairs -->
  <g opacity="0.3" stroke="#06b6d4" stroke-width="2">
    <line x1="80" y1="120" x2="220" y2="120"/>
    <line x1="80" y1="180" x2="220" y2="180"/>
    <line x1="80" y1="240" x2="220" y2="240"/>
    <line x1="80" y1="300" x2="220" y2="300"/>
    <line x1="120" y1="80" x2="120" y2="340"/>
    <line x1="180" y1="80" x2="180" y2="340"/>
  </g>

  <!-- Conversion Arc Arrow -->
  <path d="M190 140 Q 256 90 320 140" fill="none" stroke="url(#glow)" stroke-width="6" stroke-dasharray="6,4"/>
  <polygon points="325,130 335,150 315,148" fill="#10b981"/>

  <!-- Right: OGC GIS Clean Topological Polygon -->
  <polygon points="270,160 410,130 440,280 340,360 250,290" fill="#10b981" fill-opacity="0.25" stroke="url(#glow)" stroke-width="5"/>
  <circle cx="340" cy="240" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

  <!-- CAD Crosshair Snap Symbol -->
  <g stroke="#f59e0b" stroke-width="3">
    <line x1="130" y1="210" x2="170" y2="210"/>
    <line x1="150" y1="190" x2="150" y2="230"/>
    <circle cx="150" cy="210" r="14" fill="none"/>
  </g>

  <!-- Badge -->
  <rect x="156" y="405" width="200" height="42" rx="21" fill="#0f172a" stroke="url(#glow)" stroke-width="3"/>
  <text x="256" y="432" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="17" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1.5">CAD &rarr; GEOJSON</text>
</svg>